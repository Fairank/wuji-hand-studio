<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MuJoCo · Hand Viewer</title>
  <link rel="stylesheet" href="/polish.css">
  <link rel="stylesheet" href="/viewer.css">
  <script src="/locale.js" defer></script>
  <script type="module" src="/viewer.js"></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=official-wuji-1">
  <link rel="icon" type="image/png" sizes="256x256" href="/app-icon.png?v=official-wuji-1">
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-header">
      <strong class="viewer-title" id="viewer-title">MuJoCo · Hand Studio</strong>
      <nav class="viewer-nav" aria-label="Camera views">
        <button type="button" data-view="front">正面</button>
        <button type="button" data-view="side">侧面</button>
        <button type="button" data-view="reset">复位</button>
      </nav>
    </header>
    <div id="screen" tabindex="0" aria-label="MuJoCo viewer">
      <img id="image" alt="手部实时姿态" draggable="false">
      <div id="stale" role="status">正在连接画面</div>
    </div>
    <p id="notice" role="status"></p>
    <footer id="viewer-help">拖动旋转 · 滚轮缩放 · Shift拖动平移。此窗口不持有电机控制会话。</footer>
  </main>
</body>
</html>
