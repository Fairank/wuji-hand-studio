<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手部画面 · MuJoCo</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=official-wuji-1">
  <link rel="icon" type="image/png" sizes="256x256" href="/app-icon.png?v=official-wuji-1">
  <link rel="stylesheet" href="/workbench_visual.css">
  <script src="/locale.js" defer></script>
  <script type="module" src="/viewer.js"></script>
</head>
<body class="hand-viewer-window">
  <header>
    <strong id="viewer-title">手部画面 · MuJoCo</strong>
    <nav>
      <button type="button" data-view="front">正面</button>
      <button type="button" data-view="side">侧面</button>
      <button type="button" data-view="reset">复位</button>
    </nav>
  </header>
  <div id="screen" tabindex="0" aria-label="手部画面">
    <img id="image" alt="手部姿态" draggable="false" hidden>
    <div id="stale" role="status">正在准备画面…</div>
  </div>
  <p id="notice" role="status"></p>
  <footer id="viewer-help">拖动旋转 · 滚轮缩放 · Shift 拖动平移</footer>
</body>
</html>
