<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手部工作台 · WUJI</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/workspace.css"><script src="/app.js" defer></script><script src="/visual.js" defer></script><script src="/playback.js" defer></script><script src="/workspace.js" defer></script><script src="/parameters.js" defer></script><link rel="stylesheet" href="/floating_panel.css"><link rel="stylesheet" href="/studio.css"><script src="/locale.js" defer></script><script src="/floating_panel.js" defer></script><script src="/action_picker.js" defer></script><script src="/studio.js" defer></script><link rel="icon" type="image/x-icon" href="/favicon.ico?v=official-wuji-1"><link rel="icon" type="image/png" sizes="256x256" href="/app-icon.png?v=official-wuji-1"><link rel="stylesheet" href="/glass.css?v=minimal-1"><script src="/brand.js" defer></script><script src="/installation.js" defer></script><script src="/profiles.js" defer></script></head>
<body><script src="/camera.js" type="module"></script><div class="app"><header class="top"><div><h1>手部工作台</h1><p>本机连接 · 自主选择 · 实时反馈</p></div><div class="top-actions"><span id="runtime-mode">当前模式：只读</span><button id="presentation" type="button">展示模式</button></div></header>
<div id="service-error" role="alert" hidden></div>
<main class="workspace"><aside class="controls">
<section class="panel"><h2>连接设备</h2><label for="device-address">设备地址</label><input id="device-address" placeholder="自动发现所选型号" autocomplete="off" spellcheck="false"><div class="button-row"><button id="connect" class="primary" disabled>连接设备</button><button id="disconnect" disabled>断开连接</button></div><p class="hint">连接后先核对设备身份和反馈。</p></section>
<section class="panel"><h2>选择任务</h2><fieldset class="task-choices"><legend class="sr-only">选择任务</legend><label class="task"><input type="radio" name="task" value="feedback" checked><span><strong>反馈检查</strong><small>查看关节位置、速度和电流</small></span></label><label class="task"><input type="radio" name="task" value="sampling"><span><strong>触碰采样</strong><small>按手指标记并记录数据</small></span></label><label class="task unavailable"><input type="radio" name="task" value="recognition" disabled><span><strong>识别与动作</strong><small>待实机校准后开放</small></span></label></fieldset><p class="hint">识别需完成实机反馈校准；自动轻扣尚未通过验收。</p></section>
<section class="panel"><h2>采集设置</h2><div class="field-row"><label for="annotation">标签</label><select id="annotation"><option value="baseline">无触碰基线</option><option value="thumb">拇指轻触</option><option value="index">食指轻触</option><option value="middle">中指轻触</option><option value="ring">无名指轻触</option><option value="little">小指轻触</option><option value="withdrawal">轻触后抽离</option></select></div><div class="field-row"><label for="duration">时长</label><select id="duration"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option></select></div><div class="button-row"><button id="record" class="primary" disabled>开始采集</button><button id="stop" disabled>停止采集</button></div><p class="hint" id="annotation-note">先检查无触碰时的反馈。采集标签来自你的选择。</p><div id="record-progress" role="status">尚未开始采集</div></section>
</aside><section class="panel feedback-panel"><div class="feedback-heading"><h2>实时反馈</h2><span id="connection-state">本机服务连接中</span></div><p id="connection-message" class="hint">接好设备后，点击“连接设备”。</p><div class="metrics"><div><span>关节数</span><strong id="joint-count">—</strong></div><div><span>时间戳反馈率</span><strong id="device-hz">—</strong></div><div><span>采集端接收率</span><strong id="host-hz">—</strong></div><div><span>数据新鲜度</span><strong id="data-age">—</strong></div></div><div id="visual-slot"></div></section></main>
<div class="bottom-grid"><section class="panel"><h2>活动记录</h2><ol id="activity"><li>等待连接</li></ol></section><section class="panel"><h2>最近采集</h2><div id="sessions">尚无采集记录</div></section></div><footer>停止采集仅停止记录，不是硬件急停。画面显示模型状态或实测反馈，不代表触碰识别已经通过。</footer></div></body></html>
