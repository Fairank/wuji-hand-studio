name: Code review checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  software-checks:
    name: Windows source checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WUJI_CLI_AUTO_CHECK: '0'
      WUJI_APP_AUTO_CHECK: '0'
      WUJI_NO_UPDATE_CHECK: '1'
      WUJI_TELEMETRY_DISABLE: '1'
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      REVIEW_RECORD: ${{ runner.temp }}/workbench-review-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the reviewed diff
        shell: pwsh
        run: |
          if ($env:REVIEW_BASE_SHA -match '^[a-f0-9]{40}$' -and $env:REVIEW_BASE_SHA -ne ('0' * 40)) {
            git diff --check $env:REVIEW_BASE_SHA HEAD
          } else {
            git show --check --oneline HEAD
          }
          exit $LASTEXITCODE
      - name: Install the existing test requirements
        run: python -m pip install -r requirements.txt
      - name: Run source, Node and isolated complete Python regressions
        run: python scripts/run_review.py --record-dir "${{ env.REVIEW_RECORD }}"
      - name: Retain review summaries and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REVIEW_RECORD }}/*.json
            ${{ env.REVIEW_RECORD }}/*.log
          retention-days: 14
          if-no-files-found: warn
